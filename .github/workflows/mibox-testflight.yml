name: MiBox TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check out MiBox
        uses: actions/checkout@v4
        with:
          repository: rwdesignpadew/mibox
          ref: main
          path: mibox

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Apple distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mibox-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          CERTIFICATE_SHA1=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Apple Distribution/ {print $2; exit}')
          test -n "$CERTIFICATE_SHA1"
          echo "CERTIFICATE_SHA1=$CERTIFICATE_SHA1" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Create and install MiBox provisioning profiles
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node mibox/ios/ci/prepare_profiles.mjs

      - name: Generate Xcode project
        working-directory: mibox/ios
        run: xcodegen generate

      - name: Archive signed application
        working-directory: mibox/ios
        run: |
          xcodebuild \
            -project MiBoxScreen.xcodeproj \
            -scheme MiBoxScreen \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MiBoxScreen.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/MiBoxScreenDerivedData" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export signed IPA
        working-directory: mibox/ios
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/MiBoxScreen.xcarchive" \
            -exportPath "$RUNNER_TEMP/MiBoxScreenExport" \
            -exportOptionsPlist ExportOptions.plist

      - name: Validate and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          IPA_PATH=$(find "$RUNNER_TEMP/MiBoxScreenExport" -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-validation.log"
          grep -q "No errors validating" "$RUNNER_TEMP/altool-validation.log"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          grep -q "No errors uploading" "$RUNNER_TEMP/altool-upload.log"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiBoxScreen-TestFlight-IPA
          path: ${{ runner.temp }}/MiBoxScreenExport/*.ipa
          if-no-files-found: error
