name: MiBox IAP review screenshot

on:
  workflow_dispatch:

jobs:
  capture-and-upload:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out MiBox
        uses: actions/checkout@v4
        with:
          repository: rwdesignpadew/mibox
          ref: main
          path: mibox

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project and build for Simulator
        working-directory: mibox/ios
        run: |
          xcodegen generate
          xcodebuild \
            -project MiBoxScreen.xcodeproj \
            -scheme MiBoxScreen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MiBoxScreenSimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture Pro purchase screen
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/MiBoxScreenSimulator/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          APP_PATH="$APP_PATH" python3 <<'PY'
          import json, os, subprocess, time

          def run(*args, timeout=30, check=True):
              print('+', ' '.join(args), flush=True)
              return subprocess.run(args, timeout=timeout, check=check, text=True, capture_output=False)

          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], timeout=20))['devices']
          device = next(item for runtime in devices.values() for item in runtime if 'iPhone' in item['name'] and item['isAvailable'])
          device_id = device['udid']
          try:
              run('xcrun', 'simctl', 'boot', device_id, timeout=30)
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
              pass

          for _ in range(90):
              devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', '-j'], timeout=20))['devices']
              state = next((item['state'] for runtime in devices.values() for item in runtime if item['udid'] == device_id), 'Missing')
              if state == 'Booted':
                  break
              time.sleep(2)
          else:
              raise RuntimeError(f'Simulator did not boot: {state}')

          run('xcrun', 'simctl', 'install', device_id, os.environ['APP_PATH'], timeout=60)
          run('xcrun', 'simctl', 'launch', device_id, 'pl.miboxscreen.ios', '--show-pro', timeout=30)
          time.sleep(8)
          run('xcrun', 'simctl', 'io', device_id, 'screenshot', os.path.join(os.environ['RUNNER_TEMP'], 'mibox-screen-pro-review.png'), timeout=30)
          PY

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Upload screenshot and review notes
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IAP_ID: '6829911081'
        run: node mibox/ios/ci/upload_iap_review_screenshot.mjs "$RUNNER_TEMP/mibox-screen-pro-review.png"

      - name: Save review screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiBox-Screen-Pro-review
          path: ${{ runner.temp }}/mibox-screen-pro-review.png
          if-no-files-found: error
