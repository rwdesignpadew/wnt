name: Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Kanał publikacji Google Play
        required: true
        default: production
        type: choice
        options:
          - production
          - internal
      release_status:
        description: Status wydania
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
      build_number:
        description: Android versionCode
        required: true
        default: '120'
        type: string

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze shared code
        run: flutter analyze

      - name: Run portable Flutter tests
        run: |
          find test -name '*_test.dart' \
            ! -name 'architecture_guard_test.dart' \
            ! -name 'admin_mobile_completion_test.dart' \
            ! -name 'mobile_api_contract_test.dart' \
            -print0 | xargs -0 flutter test

      - name: Configure Android signing and Maps
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wnt-upload.jks"
          echo "WNT_ANDROID_KEYSTORE=$RUNNER_TEMP/wnt-upload.jks" >> "$GITHUB_ENV"
          echo "WNT_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "WNT_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "WNT_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "WNT_ANDROID_MAPS_API_KEY=$MAPS_API_KEY" >> "$GITHUB_ENV"

      - name: Build signed Android App Bundle
        run: >-
          flutter build appbundle --release
          --build-name=1.0.4
          --build-number=${{ inputs.build_number }}

      - name: Store signed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Woda-na-telefon-Android-${{ inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Submit to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pl.wnt.wodanatelefon
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
          releaseName: 1.0.4 (${{ inputs.build_number }})
          changesNotSentForReview: false
