name: Submit App Store

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          REVIEW_EMAIL: ${{ secrets.APP_REVIEW_DEMO_EMAIL }}
          REVIEW_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc" fastlane/metadata/review_information
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          KEY_CONTENT=$(base64 < "$RUNNER_TEMP/asc/AuthKey.p8" | tr -d '\n')
          printf '{"key_id":"%s","issuer_id":"%s","key":"%s","is_key_content_base64":true,"in_house":false}' "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$KEY_CONTENT" > "$RUNNER_TEMP/asc/api-key.json"
          printf '%s' "$REVIEW_EMAIL" > fastlane/metadata/review_information/demo_user.txt
          printf '%s' "$REVIEW_PASSWORD" > fastlane/metadata/review_information/demo_password.txt
          cat > fastlane/metadata/review_information/notes.txt <<'EOF'
          Konto demonstracyjne klienta. Aplikacja udostępnia funkcje zależnie od roli użytkownika.

          Rozwiązane problemy z poprzedniej recenzji:
          1. Telefon i adres są opcjonalne podczas rejestracji.
          2. Usunięcie konta: Konto > Usuń konto > Usuń konto trwale. Operacja usuwa konto i możliwość ponownego logowania.
          3. Usunięto nieużywane deklaracje odtwarzania audio i lokalizacji w tle.
          4. Zrzuty iPada przedstawiają główne funkcje aplikacji, a nie wyłącznie ekran logowania.
          EOF
          printf '%s' 'Tomasz' > fastlane/metadata/review_information/first_name.txt
          printf '%s' 'Burghardt' > fastlane/metadata/review_information/last_name.txt
          printf '%s' 'biuro@rwdesign.pl' > fastlane/metadata/review_information/email_address.txt
          printf '%s' '+48570733733' > fastlane/metadata/review_information/phone_number.txt

      - name: Close unresolved rejected submission
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          gem install jwt --no-document
          cat > "$RUNNER_TEMP/close-review.rb" <<'RUBY'
          require 'jwt'
          require 'net/http'
          require 'json'
          key = OpenSSL::PKey::EC.new(ENV.fetch('ASC_PRIVATE_KEY'))
          token = JWT.encode({ iss: ENV.fetch('ASC_ISSUER_ID'), exp: Time.now.to_i + 900, aud: 'appstoreconnect-v1' }, key, 'ES256', { kid: ENV.fetch('ASC_KEY_ID') })
          def request(method, path, token, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            req = method == :get ? Net::HTTP::Get.new(uri) : Net::HTTP::Patch.new(uri)
            req['Authorization'] = "Bearer #{token}"
            if body
              req['Content-Type'] = 'application/json'
              req.body = JSON.generate(body)
            end
            Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
          end
          app_response = request(:get, '/v1/apps?filter%5BbundleId%5D=pl.wnt.wntDriver', token)
          abort "Apps HTTP #{app_response.code}: #{app_response.body}" unless app_response.is_a?(Net::HTTPSuccess)
          app = JSON.parse(app_response.body).fetch('data').first
          submissions_response = request(:get, "/v1/reviewSubmissions?filter%5Bapp%5D=#{app['id']}&limit=10", token)
          abort "Submissions HTTP #{submissions_response.code}: #{submissions_response.body}" unless submissions_response.is_a?(Net::HTTPSuccess)
          JSON.parse(submissions_response.body).fetch('data').each do |submission|
            next unless submission.dig('attributes', 'state') == 'UNRESOLVED_ISSUES'
            payload = { data: { type: 'reviewSubmissions', id: submission['id'], attributes: { canceled: true } } }
            response = request(:patch, "/v1/reviewSubmissions/#{submission['id']}", token, payload)
            abort "Cancel HTTP #{response.code}: #{response.body}" unless response.code.to_i.between?(200, 299)
            puts "Canceling unresolved submission #{submission['id']}"
          end
          RUBY
          ruby "$RUNNER_TEMP/close-review.rb"

      - name: Upload metadata, screenshots and submit build 45
        run: |
          gem install fastlane --no-document
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc/api-key.json" \
            --app_identifier pl.wnt.wntDriver \
            --app_version 1.0 \
            --build_number 45 \
            --metadata_path fastlane/metadata \
            --screenshots_path fastlane/screenshots \
            --overwrite_screenshots true \
            --skip_binary_upload true \
            --submit_for_review true \
            --automatic_release false \
            --force true \
            --precheck_include_in_app_purchases false \
            --submission_information '{"export_compliance_uses_encryption":false}'
